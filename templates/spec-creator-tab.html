<!-- ========================================================= -->
<!-- TAB: SPEC CREATOR -->
<!-- Reconstruido fielmente desde index-old.html -->
<!-- ========================================================= -->

<form id="spec-creator-form">

    <!-- =========== CARD: INFORMACIÓN GENERAL =========== -->
    <div class="card">
        <div class="card-header">
            <h2 class="card-title"><i class="fas fa-file-invoice"></i> Información General</h2>
            <div class="card-actions">
                <button type="button" class="btn btn-success btn-sm"
                    onclick="document.getElementById('excelFile').click()">
                    <i class="fas fa-file-excel"></i> Cargar SWO
                </button>
                <button type="button" id="tegra-pdf-uploader-btn" class="btn btn-outline btn-sm"
                    title="Cargar Tech Pack Nike desde PDF">
                    <i class="fas fa-file-pdf"></i> Cargar Tech Pack Nike
                </button>
                <button type="button" class="btn btn-danger btn-sm" onclick="clearForm()">
                    <i class="fas fa-trash"></i> Limpiar
                </button>
            </div>
        </div>
        <div class="card-body">
            <div class="form-grid">
                <div class="form-group">
                    <label for="customer" class="form-label">CLIENTE:</label>
                    <input type="text" id="customer" class="form-control" list="customer-list"
                        data-bind-general="customer" oninput="updateClientLogo(); handleGearForSportLogic();">
                    <datalist id="customer-list">
                        <option value="GEAR FOR SPORT">
                        <option value="ADIDAS">
                        <option value="NIKE">
                        <option value="UNDER ARMOUR">
                        <option value="HADDAD">
                        <option value="FANATICS">
                    </datalist>
                </div>
                <div class="form-group">
                    <label for="style" class="form-label">STYLE:</label>
                    <input type="text" id="style" class="form-control" data-bind-general="style"
                        oninput="handleGearForSportLogic();">
                </div>
                <div class="form-group">
                    <label for="colorway" class="form-label">COLORWAY:</label>
                    <input type="text" id="colorway" class="form-control" data-bind-general="colorway" oninput="updateGarmentColorRecognition()">
                </div>
                <div class="form-group">
                    <label for="season" class="form-label">SEASON:</label>
                    <input type="text" id="season" class="form-control" data-bind-general="season">
                </div>
                <div class="form-group">
                    <label for="pattern" class="form-label">PATTERN #:</label>
                    <input type="text" id="pattern" class="form-control" data-bind-general="pattern">
                </div>
                <div class="form-group">
                    <label for="po" class="form-label">P.O. #:</label>
                    <input type="text" id="po" class="form-control" data-bind-general="po"
                        oninput="handleGearForSportLogic();">
                </div>
                <div class="form-group">
                    <label for="sample-type" class="form-label">SAMPLE TYPE:</label>
                    <input type="text" id="sample-type" class="form-control" data-bind-general="sampleType">
                </div>
                <div class="form-group">
                    <label for="name-team" class="form-label">NAME / TEAM:</label>
                    <input type="text" id="name-team" class="form-control" data-bind-general="nameTeam">
                </div>
                <div class="form-group">
                    <label for="gender" class="form-label">GENDER:</label>
                    <input type="text" id="gender" class="form-control" data-bind-general="gender">
                </div>
                <div class="form-group">
                    <label for="designer" class="form-label">DISEÑADOR:</label>
                    <select id="designer" class="form-control" data-bind-general="designer">
                        <option value="">Seleccionar...</option>
                        <option value="ELMER VELEZ">ELMER VELEZ</option>
                        <option value="DANIEL HERNANDEZ">DANIEL HERNANDEZ</option>
                        <option value="CINDY PINEDA">CINDY PINEDA</option>
                        <option value="FERNANDO FERRERA">FERNANDO FERRERA</option>
                        <option value="NILDA CORDOBA">NILDA CORDOBA</option>
                        <option value="OTRO">OTRO</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="base-size" class="form-label">TALLA BASE:</label>
                    <input type="text" id="base-size" class="form-control" data-bind-general="baseSize"
                        placeholder="M / L">
                </div>
                <div class="form-group">
                    <label for="fabric" class="form-label">TELA:</label>
                    <input type="text" id="fabric" class="form-control" data-bind-general="fabric"
                        placeholder="Algodón, Polyester, Twill..." oninput="updateGarmentColorRecognition()">
                </div>
                <div class="form-group" style="grid-column: 1 / -1;">
                    <div id="garment-color-recognition" class="color-recognition-note">Colorway sin analizar.</div>
                </div>
            </div>
        </div>
    </div>

    <!-- =========== CARD: DATOS DE PATRÓN Y ENCOGIMIENTOS =========== -->
    <div class="card">
        <div class="card-header">
            <h2 class="card-title"><i class="fas fa-ruler-combined"></i> Patrón y encogimientos</h2>
        </div>
        <div class="card-body">
            <div class="form-grid two-col">
                <div class="form-group">
                    <label for="spec-stage-date" class="form-label">FECHA DE ETAPA:</label>
                    <input type="text" id="spec-stage-date" class="form-control" data-bind-general="stageDate" readonly>
                </div>
                <div class="form-group">
                    <label for="exported-pattern-file" class="form-label">EXPORTED PATTERN (.AI):</label>
                    <input type="file" id="exported-pattern-file" class="form-control" accept=".ai,application/pdf">
                    <small id="exported-pattern-status" class="form-help">Carga el patrón para extraer las piezas y sus encogimientos.</small>
                    <input type="text" id="exported-pattern-name" class="form-control" data-bind-general="exportedPatternName" placeholder="El nombre se completa al cargar el archivo" readonly>
                </div>
                <div class="form-group">
                    <label for="blank-pattern-name" class="form-label">BLANK PATTERN FOR PRINT:</label>
                    <input type="text" id="blank-pattern-name" class="form-control" data-bind-general="blankPatternName" placeholder="Nombre del archivo e iniciales">
                </div>
                <div class="form-group">
                    <label for="customer-schematic-name" class="form-label">CUSTOMER SCHEMATIC:</label>
                    <input type="text" id="customer-schematic-name" class="form-control" data-bind-general="customerSchematicName" placeholder="Pegar el nombre exacto del archivo">
                </div>
                <div class="form-group">
                    <label for="customer-techpack-name" class="form-label">CUSTOMER TECHPACK:</label>
                    <input type="text" id="customer-techpack-name" class="form-control" data-bind-general="customerTechpackName" placeholder="Se completa al usar “Cargar Tech Pack Nike”" readonly>
                </div>
            </div>
            <p class="form-help pattern-general-help">Carga el patrón para detectar piezas y encogimientos. La asignación se hace dentro de cada placement.</p>
        </div>
    </div>

    <style>
        .catalog-help-trigger { display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;margin-left:6px;border:1px solid var(--border-dark);border-radius:50%;background:transparent;color:var(--text-secondary);font-weight:700;cursor:pointer; }
        .catalog-help-popover { margin-top:7px;padding:9px 11px;border:1px solid var(--border-dark);border-radius:6px;color:var(--text-secondary);font-size:12px;line-height:1.45; }
        .pattern-general-help{display:block;margin-top:12px}
.placement-pattern-assignment{margin:12px 0;padding:12px;border:1px solid var(--border-dark);border-radius:8px}
.placement-pattern-assignment .form-group{margin-bottom:8px}
.placement-pattern-assignment .pattern-piece-assignment-status{display:block;margin-top:6px}
.placement-pattern-assignment .pattern-shrinkage-line{font-size:12px}
.pattern-piece-picker { display: grid; grid-template-columns: repeat(2, minmax(180px, 1fr)); gap: 10px 14px; align-items: end; margin-top: 12px; }
        .pattern-piece-picker .form-group { margin-bottom: 0; }
        #pattern-piece-add, #pattern-piece-picker-status { grid-column: 1 / -1; }
        .pattern-shrinkage-export { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border-dark); }
        .pattern-shrinkage-line { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; line-height: 1.35; overflow-wrap: anywhere; padding: 5px 0; border-bottom: 1px solid var(--border-light); }
        .pattern-shrinkage-line button { flex: 0 0 auto; }
        .pattern-placement-group { margin-bottom: 10px; }
        .pattern-placement-group > strong { display: block; margin-bottom: 4px; color: var(--tegra-red); }
        .pattern-shrinkage-empty { margin: 0; color: var(--text-secondary); font-size: 0.85rem; }
        #exported-pattern-status { display: block; margin: 5px 0; color: var(--text-secondary); }
        @media (max-width: 650px) { .pattern-piece-picker { grid-template-columns: 1fr; } }
    </style>

    <!-- =========== CARD: PLACEMENTS =========== -->
    <div class="card">
        <div class="card-header">
            <h2 class="card-title"><i class="fas fa-layer-group"></i> Placements</h2>
            <div class="card-actions">
                <button type="button" class="btn btn-primary" onclick="addNewPlacement()"><i class="fas fa-plus"></i>
                    Añadir Placement</button>
            </div>
        </div>
        <div class="card-body">
            <!-- Pestañas para Placements -->
            <div id="placements-tabs" class="placements-tabs"></div>
            <!-- Contenedores para cada Placement -->
            <div id="placements-container"></div>
        </div>
    </div>

    <!-- =========== CARD: INFORMACIÓN TÉCNICA =========== -->
    <div class="card">
        <div class="card-header">
            <h2 class="card-title"><i class="fas fa-user-cog"></i> Información Técnica</h2>
        </div>
        <div class="card-body">
            <div class="form-grid two-col">
                <div class="form-group">
                    <label for="technician-name" class="form-label">NOMBRE TÉCNICO:</label>
                    <input type="text" id="technician-name" class="form-control" data-bind-general="technicianName"
                        placeholder="Nombre del técnico">
                </div>
                <div class="form-group" style="grid-column: 1 / -1;">
                    <label for="technical-comments" class="form-label">COMENTARIOS TÉCNICOS:</label>
                    <textarea id="technical-comments" class="form-control" data-bind-general="technicalComments"
                        rows="2" placeholder="Notas para planta..."></textarea>
                </div>
            </div>
        </div>
    </div>

    <!-- =========== CARD: ACCIONES GLOBALES =========== -->
    <div class="card">
        <div class="card-header">
            <h2 class="card-title"><i class="fas fa-cogs"></i> Acciones</h2>
        </div>
        <div class="card-body">
            <div class="global-actions">
                <button type="button" class="btn btn-primary" onclick="saveCurrentSpec()"><i class="fas fa-save"></i>
                    Guardar Spec</button>
                <button type="button" class="btn btn-primary" onclick="exportPDF()"><i class="fas fa-file-pdf"></i>
                    Imprimir / Guardar PDF</button>
                <button type="button" class="btn btn-outline" onclick="exportHTML()"><i class="fas fa-file-code"></i>
                    Descargar HTML Spec</button>
                <button type="button" class="btn btn-outline" onclick="exportToExcel()"><i
                        class="fas fa-calculator"></i> Calculadora (Excel)</button>
                <button type="button" class="btn btn-outline" onclick="exportJSON()"><i class="fas fa-file-code"></i>
                    Descargar JSON</button>
                <button type="button" class="btn btn-outline" onclick="clearForm()"><i class="fas fa-trash"></i> Limpiar
                    Formulario</button>
                <button type="button" class="btn btn-outline" onclick="downloadProjectZip()"><i
                        class="fas fa-file-archive"></i> Descargar Proyecto (.zip)</button>
            </div>
        </div>
    </div>
</form>
